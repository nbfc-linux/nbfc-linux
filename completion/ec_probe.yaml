prog: "ec_probe"
help: "Probing tool for embedded controllers"
options:
  - option_strings: ["-h", "--help"]
    help: "show this help message and exit"

  - option_strings: ["-e", "--embedded-controller"]
    metavar: "EC"
    help: "Specify embedded controller to use"
    complete: ["choices", ["acpi_ec", "ec_sys", "dev_port"]]
---
prog: "ec_probe dump"
help: "Dump all EC registers"
options:
  - option_strings: ["-c", "--color"]
    help: "Force colored output"

  - option_strings: ["-C", "--no-color"]
    help: "Disable colored output"
---
prog: "ec_probe load"
help: "Load a previously made dump into the embedded controller"
positionals:
  - number: 1
    metavar: "FILE"
    complete: ["file"]
---
prog: "ec_probe read"
help: "Read a byte from a EC register"
options:
  - option_strings: ["-w", "--word"]
    help: "Combine two registers into one"

  - option_strings: ["-m", "--map"]
    metavar: "FILE"
    help: "Specify map file for resolving register names"
    complete: ["file"]
    capture: '_EC_PROBE_MAP_FILE'

positionals:
  - number: 1
    metavar: "REGISTER"
    help: "Register source"
    complete: ['combine', [
      ["range", 0, 255],
      ["exec", '_ec_probe_complete_map_register']
    ]]
---
prog: "ec_probe write"
help: "Write a byte to a EC register"
options:
  - option_strings: ["-w", "--word"]
    help: "Combine two registers into one"

  - option_strings: ["-m", "--map"]
    metavar: "FILE"
    help: "Specify map file for resolving register names"
    complete: ["file"]
    capture: '_EC_PROBE_MAP_FILE'

positionals:
  - number: 1
    metavar: "REGISTER"
    help: "Register destination"
    complete: ['combine', [
      ["range", 0, 255],
      ["exec", '_ec_probe_complete_map_register']
    ]]

  - number: 2
    metavar: "VALUE"
    help: "Value to write"
    complete: ["integer"]
---
prog: "ec_probe read_bit"
help: "Read a bit from a EC register"
options:
  - option_strings: ["-m", "--map"]
    metavar: "FILE"
    help: "Specify map file for resolving register names"
    complete: ["file"]
    capture: '_EC_PROBE_MAP_FILE'

positionals:
  - number: 1
    metavar: "REGISTER"
    help: "Register source"
    complete: ['combine', [
      ["range", 0, 255],
      ["exec", '_ec_probe_complete_map_register']
    ]]

  - number: 2
    metavar: "BIT-OFFSET"
    help: "Bit offset (0-7)"
    complete: ["range", 0, 7]
---
prog: "ec_probe write_bit"
help: "Write a bit to a EC register"
options:
  - option_strings: ["-d", "--dry"]
    help: "Print the resulting value without writing it"

  - option_strings: ["-m", "--map"]
    metavar: "FILE"
    help: "Specify map file for resolving register names"
    complete: ["file"]
    capture: '_EC_PROBE_MAP_FILE'

positionals:
  - number: 1
    metavar: "REGISTER"
    help: "Register destination"
    complete: ['combine', [
      ["range", 0, 255],
      ["exec", '_ec_probe_complete_map_register']
    ]]

  - number: 2
    metavar: "BIT-OFFSET"
    help: "Bit offset (0-7)"
    complete: ["range", 0, 7]

  - number: 3
    metavar: "VALUE"
    help: "Value to write"
    complete: ["choices", ["0", "1"]]
---
prog: "ec_probe monitor"
help: "Monitor all EC registers for changes"
options:
  - option_strings: ["-i", "--interval"]
    metavar: "seconds"
    help: "Monitored timespan"
    complete: ["float"]

  - option_strings: ["-t", "--timespan"]
    metavar: "seconds"
    help: "Set poll intervall"
    complete: ["integer"]

  - option_strings: ["-r", "--report"]
    metavar: "report"
    help: "Save all readings as a CSV file"
    complete: ["file"]

  - option_strings: ["-c", "--clearly"]
    help: "Blanks out consecutive duplicate readings"

  - option_strings: ["-d", "--decimal"]
    help: "Output register readings in decimal format"

  - option_strings: ['-C', '--cpu']
    help: "Record CPU temperatures"

  - option_strings: ['-G', '--gpu']
    help: "Record GPU temperatures"
---
prog: "ec_probe watch"
help: "Monitor all EC registers for changes (alternative version)"
options:
  - option_strings: ["-i", "--interval"]
    metavar: "seconds"
    help: "Sets the update interval in seconds"
    complete: ["float"]

  - option_strings: ["-t", "--timespan"]
    metavar: "seconds"
    help: "Sets how many seconds the program will run"
    complete: ["integer"]
---
prog: "ec_probe acpi_call"
help: "Call an ACPI method"
options:
  - option_strings: ["-m", "--map"]
    metavar: "FILE"
    help: "Specify map file for resolving methods"
    complete: ["file"]
    capture: '_EC_PROBE_MAP_FILE'

  - option_strings: ["-d", "--dry"]
    help: "Print the ACPI command without executing it"

positionals:
  - number: 1
    metavar: "METHOD"
    help: "Method to call"
    complete: ["exec", "_ec_probe_complete_map_method"]

  - number: 2
    metavar: "ARG1"
    help: "First argument"
    complete: ["integer"]

  - number: 3
    metavar: "ARG2"
    help: "Second argument"
    complete: ["integer"]

  - number: 4
    metavar: "ARG3"
    help: "Third argument"
    complete: ["integer"]

  - number: 5
    metavar: "ARG4"
    help: "Fourth argument"
    complete: ["integer"]

  - number: 6
    metavar: "ARG5"
    help: "Fifth argument"
    complete: ["integer"]

  - number: 7
    metavar: "ARG6"
    help: "Sixth argument"
    complete: ["integer"]

  - number: 8
    metavar: "ARG7"
    help: "Seventh argument"
    complete: ["integer"]

  - number: 9
    metavar: "ARG8"
    help: "Eighth argument"
    complete: ["integer"]
---
prog: "ec_probe graph"
help: "Visualize recordings made by `ec_probe monitor -r`"
options:
  - option_strings: ["-d", "--decimal"]
    help: "Read register values as decimal numbers"

  - option_strings: ["--register-color"]
    metavar: "COLOR"
    help: "Specify color for drawing register line"
    complete: ["none"]

  - option_strings: ["--cpu-color"]
    metavar: "COLOR"
    help: "Specify color for drawing CPU temperature line"
    complete: ["none"]

  - option_strings: ["--gpu-color"]
    metavar: "COLOR"
    help: "Specify color for drawing GPU temperature line"
    complete: ["none"]

positionals:
  - number: 1
    metavar: "FILE"
    help: "CSV file containing the recordings"
    complete: ["file"]
---
prog: "ec_probe evaluate"
help: "Calculate correlation between registers and CPU/GPU temperature"
options:
  - option_strings: ["-d", "--decimal"]
    help: "Read register values as decimal numbers"

positionals:
  - number: 1
    metavar: "FILE"
    help: "CSV file containing the recordings"
    complete: ["file"]
---
prog: "ec_probe poke"
help: "Hold a register at a value, sampling another"
options:
  - option_strings: ["-m", "--map"]
    metavar: "FILE"
    help: "Specify map file for resolving register names"
    complete: ["file"]
    capture: '_EC_PROBE_MAP_FILE'

  - option_strings: ["-w", "--watch"]
    metavar: "REGISTER"
    help: "Register to sample (default: REGISTER)"
    complete: ['combine', [
      ["range", 0, 255],
      ["exec", '_ec_probe_complete_map_register']
    ]]

  - option_strings: ["-t", "--timespan"]
    metavar: "seconds"
    help: "How long to hold VALUE"
    complete: ["integer"]

  - option_strings: ["-i", "--interval"]
    metavar: "seconds"
    help: "Sampling interval"
    complete: ["float"]

  - option_strings: ["-n", "--no-restore"]
    help: "Do not restore the original value"

positionals:
  - number: 1
    metavar: "REGISTER"
    help: "Register to write"
    complete: ['combine', [
      ["range", 0, 255],
      ["exec", '_ec_probe_complete_map_register']
    ]]

  - number: 2
    metavar: "VALUE"
    help: "Value to write"
    complete: ["range", 0, 255]
---
prog: "ec_probe scan"
help: "Try candidate values on a register, sampling another"
options:
  - option_strings: ["-m", "--map"]
    metavar: "FILE"
    help: "Specify map file for resolving register names"
    complete: ["file"]
    capture: '_EC_PROBE_MAP_FILE'

  - option_strings: ["-w", "--watch"]
    metavar: "REGISTER"
    help: "Register to sample (default: REGISTER)"
    complete: ['combine', [
      ["range", 0, 255],
      ["exec", '_ec_probe_complete_map_register']
    ]]

  - option_strings: ["-t", "--timespan"]
    metavar: "seconds"
    help: "Seconds per candidate value"
    complete: ["integer"]

  - option_strings: ["-i", "--interval"]
    metavar: "seconds"
    help: "Sampling interval"
    complete: ["float"]

positionals:
  - number: 1
    metavar: "REGISTER"
    help: "Register to write"
    complete: ['combine', [
      ["range", 0, 255],
      ["exec", '_ec_probe_complete_map_register']
    ]]
---
prog: "ec_probe shell"
help: "Read commands from STDIN"
